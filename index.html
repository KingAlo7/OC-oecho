<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#c2c5a6">
<title>OC Reaktionen — ÖChO</title>
<link rel="icon" type="image/svg+xml" href="./assets/logo.svg">
<link rel="manifest" href="./manifest.webmanifest">
<link rel="apple-touch-icon" href="./assets/apple-touch-icon.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="OC Reaktionen">
<script src="./pwa.js" defer></script>
<script src="https://cdn.jsdelivr.net/npm/openchemlib/dist/openchemlib-full.js"></script>
<script src="./chem-text.js"></script>
<script src="./mol-renderer.js"></script>
<style>
:root {
  /* ÖChO light palette */
  --bg:#faf9f5;
  --surface:#ffffff;
  --surface2:#f3f3ec;
  --surface3:#ecebe0;
  --border:#e4e3d8;
  --border2:#cfceb8;
  --text:#1a1a18;
  --text-soft:#3a3a35;
  --muted:#6b6a5d;
  --muted2:#9a9889;
  --accent:#e2001a;
  --accent-soft:#fde4e7;
  --accent2:#ed6b06;
  --sage:#c2c5a6;
  --green:#5a8a2a;
  --red:#c91020;
  --yellow:#b87a00;
  --sidebar:clamp(264px, 20vw, 304px);
  --shadow-sm:0 1px 2px rgba(60,55,40,0.04);
  --shadow-md:0 2px 8px rgba(60,55,40,0.06);
  --header-h:56px;
  /* Reaction drawings: OCL caps the bond at 24 px, which reads small on a
     wide screen — scale the (vector) drawing up, never past its box. */
  --draw-scale:1.45;
}
*{box-sizing:border-box;margin:0;padding:0;}
html,body{height:100%;overflow:hidden;}
body{background:var(--bg);color:var(--text);font-family:'Segoe UI',system-ui,-apple-system,sans-serif;display:flex;flex-direction:column;-webkit-font-smoothing:antialiased;}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;}
#search:focus-visible{outline:none;}

header{
  background:var(--surface);border-bottom:1px solid var(--border);
  padding:0 1.25rem;height:56px;display:flex;align-items:center;gap:1rem;
  flex-shrink:0;z-index:20;box-shadow:var(--shadow-sm);
}
.brand{display:flex;align-items:center;gap:0.6rem;flex-shrink:0;}
.brand-home{text-decoration:none;color:inherit;transition:opacity 0.12s;-webkit-tap-highlight-color:transparent;}
.brand-home:hover{opacity:0.78;}
.brand-home:active{opacity:0.6;}
.brand-logo{width:30px;height:30px;color:var(--accent);flex-shrink:0;}
.brand-logo svg{width:100%;height:100%;display:block;}
.brand-name{font-size:1.05rem;font-weight:700;color:var(--text);letter-spacing:-0.01em;white-space:nowrap;}
.brand-sub{font-size:0.72rem;font-weight:600;color:var(--muted);letter-spacing:0.04em;text-transform:uppercase;margin-left:-0.3rem;padding:0.15rem 0.45rem;background:var(--surface2);border:1px solid var(--border);border-radius:6px;}

.search-wrap{flex:1;max-width:380px;position:relative;}
.search-icon{position:absolute;left:0.7rem;top:50%;transform:translateY(-50%);
  color:var(--muted2);font-size:0.95rem;pointer-events:none;}
#search{
  width:100%;background:var(--surface2);color:var(--text);
  border:1px solid var(--border);border-radius:8px;
  padding:0.42rem 0.8rem 0.42rem 2.1rem;font-size:0.86rem;
  transition:all 0.15s;
}
#search:focus{outline:none;border-color:var(--accent);background:var(--surface);box-shadow:0 0 0 3px var(--accent-soft);}
#search::placeholder{color:var(--muted2);}

.header-right{margin-left:auto;display:flex;align-items:center;gap:0.5rem;}
.count-badge{font-size:0.75rem;color:var(--muted);background:var(--surface2);
  border:1px solid var(--border);border-radius:20px;padding:0.22rem 0.7rem;white-space:nowrap;}

.nav-link{
  font-size:0.82rem;font-weight:600;text-decoration:none;
  color:var(--accent);border:1px solid var(--accent);
  border-radius:7px;padding:0.32rem 0.78rem;
  transition:all 0.15s;white-space:nowrap;
}
.nav-link:hover{background:var(--accent);color:#fff;}
.nav-link.muted{color:var(--muted);border-color:var(--border2);}
.nav-link.muted:hover{background:var(--surface2);color:var(--text);border-color:var(--muted);}

/* Sized by the body's flex column, not by 100vh — on phones 100vh is the
   height with the browser bars hidden, which would push the bottom of the
   page under the toolbar. */
.layout{display:flex;flex:1;min-height:0;overflow:hidden;}

.hamburger{display:none;align-items:center;justify-content:center;width:40px;height:40px;
  border:1px solid var(--border);border-radius:8px;background:var(--surface);cursor:pointer;
  color:var(--text);font-size:1.18rem;line-height:1;flex-shrink:0;font-family:inherit;
  -webkit-tap-highlight-color:transparent;}
.hamburger:active{background:var(--surface2);}

.sidebar{
  width:var(--sidebar);background:var(--surface);
  border-right:1px solid var(--border);
  overflow-y:auto;overscroll-behavior:contain;flex-shrink:0;
  display:flex;flex-direction:column;
}
.sidebar::-webkit-scrollbar{width:6px;}
.sidebar::-webkit-scrollbar-thumb{background:var(--border2);border-radius:3px;}
.sidebar::-webkit-scrollbar-track{background:transparent;}
.sidebar-top{padding:0.85rem 0.85rem 0.55rem;border-bottom:1px solid var(--border);flex-shrink:0;}
.sidebar-foot{margin-top:auto;padding:0.9rem 1rem;font-size:0.72rem;color:var(--muted2);text-decoration:none;flex-shrink:0;}
.sidebar-foot:hover{color:var(--accent);}
.sidebar-label{font-size:0.68rem;font-weight:700;text-transform:uppercase;
  letter-spacing:0.1em;color:var(--muted2);padding:0 0.25rem;margin-bottom:0.4rem;}

.cat-group{border-bottom:1px solid var(--border);}
.cat-header{
  display:flex;align-items:center;gap:0.55rem;
  padding:0.62rem 0.95rem;cursor:pointer;
  font-size:0.75rem;font-weight:700;
  color:var(--muted);text-transform:uppercase;letter-spacing:0.06em;
  transition:all 0.12s;user-select:none;
}
.cat-header > span:nth-child(2){
  flex:1;min-width:0;
  word-break:break-word;overflow-wrap:anywhere;hyphens:auto;
  line-height:1.25;
}
.cat-header:hover{color:var(--text);background:var(--surface2);}
.cat-header.open{color:var(--accent);}
.cat-arrow{font-size:0.6rem;flex-shrink:0;transition:transform 0.2s;color:var(--muted2);}
.cat-header.open .cat-arrow{transform:rotate(90deg);color:var(--accent);}
.cat-count{margin-left:auto;font-size:0.68rem;background:var(--surface2);border:1px solid var(--border);
  border-radius:20px;padding:0.05rem 0.45rem;color:var(--muted);font-weight:600;}

.cat-items{display:none;padding:0.2rem 0 0.4rem;}
.cat-header.open + .cat-items{display:block;}

.rxn-link{
  display:flex;align-items:flex-start;gap:0.45rem;
  padding:0.45rem 0.95rem 0.45rem 1.7rem;
  font-size:0.84rem;line-height:1.35;color:var(--text-soft);cursor:pointer;
  border-left:3px solid transparent;
  transition:all 0.12s;
}
.rxn-link:hover{color:var(--text);background:var(--surface2);}
.rxn-link.active{color:var(--accent);border-left-color:var(--accent);background:var(--accent-soft);font-weight:600;}
.rxn-link.hidden{display:none;}
.rxn-link .diff-badge{margin-top:1px;}
/* Long names wrap to a second line instead of being cut off mid-word. */
.rxn-link .rxn-name{flex:1;min-width:0;display:-webkit-box;-webkit-box-orient:vertical;
  -webkit-line-clamp:2;overflow:hidden;overflow-wrap:break-word;}

/* Difficulty system — desaturated, minimal. Badges are outlined letters;
   row left-borders are tinted by difficulty when no other state is active. */
:root{
  --diff-A:#6fa385; --diff-A-soft:rgba(111,163,133,0.10);
  --diff-B:#7491b8; --diff-B-soft:rgba(116,145,184,0.10);
  --diff-C:#b8884d; --diff-C-soft:rgba(184,136,77,0.10);
  --diff-D:#9a7fad; --diff-D-soft:rgba(154,127,173,0.10);
}
.diff-badge{display:inline-flex;align-items:center;justify-content:center;
  min-width:16px;height:16px;padding:0 4px;border-radius:3px;
  font-size:0.62rem;font-weight:700;line-height:1;
  border:1px solid currentColor;background:transparent;flex-shrink:0;}
.diff-badge.diff-A{color:var(--diff-A);}
.diff-badge.diff-B{color:var(--diff-B);}
.diff-badge.diff-C{color:var(--diff-C);}
.diff-badge.diff-D{color:var(--diff-D);}
.rxn-link.diff-A:not(.active){border-left-color:var(--diff-A-soft);}
.rxn-link.diff-B:not(.active){border-left-color:var(--diff-B-soft);}
.rxn-link.diff-C:not(.active){border-left-color:var(--diff-C-soft);}
.rxn-link.diff-D:not(.active){border-left-color:var(--diff-D-soft);}

.diff-filter{display:flex;gap:0.3rem;margin-top:0.5rem;}
.diff-pill{flex:1;padding:0.32rem 0;border:1px solid var(--border);
  background:var(--surface);color:var(--muted);
  font-size:0.72rem;font-weight:700;text-align:center;border-radius:5px;
  cursor:pointer;transition:all 0.12s;user-select:none;}
.diff-pill:hover{color:var(--text);border-color:var(--border2);}
.diff-pill.active{color:var(--text);}
.diff-pill.diff-A.active{border-color:var(--diff-A);background:var(--diff-A-soft);}
.diff-pill.diff-B.active{border-color:var(--diff-B);background:var(--diff-B-soft);}
.diff-pill.diff-C.active{border-color:var(--diff-C);background:var(--diff-C-soft);}
.diff-pill.diff-D.active{border-color:var(--diff-D);background:var(--diff-D-soft);}

.main{flex:1;overflow-y:auto;display:flex;flex-direction:column;}
.main::-webkit-scrollbar{width:8px;}
.main::-webkit-scrollbar-thumb{background:var(--border2);border-radius:4px;}
.main::-webkit-scrollbar-track{background:transparent;}

.welcome{
  flex:1;display:flex;flex-direction:column;
  align-items:center;justify-content:center;
  padding:3rem 2rem;text-align:center;
}
.welcome-logo{width:96px;height:96px;color:var(--accent);margin-bottom:1.5rem;opacity:0.92;}
.welcome-logo svg{width:100%;height:100%;}
.welcome h1{
  font-size:1.85rem;font-weight:700;margin-bottom:0.55rem;color:var(--text);letter-spacing:-0.02em;
}
.welcome h1 .red{color:var(--accent);}
.welcome p{color:var(--muted);line-height:1.75;max-width:540px;margin-bottom:2.5rem;font-size:0.95rem;}
.cat-grid{
  display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));
  gap:0.7rem;max-width:720px;width:100%;
}
.cat-card{
  background:var(--surface);border:1px solid var(--border);border-radius:10px;
  padding:1.1rem;cursor:pointer;text-align:left;
  transition:all 0.15s;-webkit-tap-highlight-color:transparent;
}
.cat-card:active{border-color:var(--accent);}
@media (hover:hover){
  .cat-card:hover{border-color:var(--accent);transform:translateY(-2px);box-shadow:var(--shadow-md);}
}
/* Category mark: a reaction-type abbreviation on a tile, like an element
   in the periodic table. */
.cat-card-icon{display:inline-flex;align-items:center;justify-content:center;
  min-width:2.6rem;height:2.6rem;padding:0 0.5rem;margin-bottom:0.75rem;
  border-radius:8px;background:var(--accent-soft);color:var(--accent);
  font-size:0.95rem;font-weight:700;letter-spacing:-0.01em;line-height:1;white-space:nowrap;}
.cat-card-name{font-size:0.85rem;font-weight:600;margin-bottom:0.2rem;color:var(--text);
  word-break:break-word;overflow-wrap:anywhere;hyphens:auto;line-height:1.3;}
.cat-card-count{font-size:0.72rem;color:var(--muted);}

.rxn-page{padding:2rem 2.5rem 3rem;max-width:880px;width:100%;margin:0 auto;}
.rxn-breadcrumb{
  font-size:0.76rem;color:var(--muted);margin-bottom:0.8rem;
  display:flex;align-items:center;gap:0.4rem;min-width:0;
}
.rxn-breadcrumb .sep{color:var(--muted2);}
.rxn-breadcrumb .cat-name{color:var(--accent);cursor:pointer;font-weight:600;white-space:nowrap;flex-shrink:0;}
.rxn-breadcrumb .cat-name:hover{text-decoration:underline;}
.rxn-breadcrumb .crumb-current{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}

.rxn-title{font-size:1.6rem;font-weight:700;margin-bottom:0.25rem;line-height:1.3;color:var(--text);letter-spacing:-0.02em;}
.rxn-subtitle{font-size:0.92rem;color:var(--muted);margin-bottom:1rem;font-style:italic;}

.tag{
  font-size:0.7rem;font-weight:600;padding:0.2rem 0.6rem;border-radius:20px;
  background:var(--surface2);color:var(--muted);border:1px solid var(--border);
  letter-spacing:0.02em;
}

.rxn-drawing{
  background:#ffffff;border:1px solid var(--border);border-radius:12px;
  padding:1.75rem 1.5rem;margin-bottom:1.5rem;
  display:flex;justify-content:center;align-items:center;
  min-height:140px;overflow-x:auto;
  box-shadow:var(--shadow-sm);
}
.rxn-drawing svg{display:block;max-width:100%;height:auto;}
.rxn-drawing .struct-slot > svg.scaled{width:min(100%, calc(var(--nat-w) * var(--draw-scale)));}
.struct-slot{display:flex;justify-content:center;align-items:center;width:100%;}
.struct-slot svg{display:block;max-width:100%;height:auto;}
.scheme-text{
  font-size:0.92rem;color:var(--text);text-align:center;
  line-height:2.2;font-family:ui-monospace,'Cascadia Code','Fira Code',monospace;white-space:pre-wrap;
}

.rxn-details{
  background:var(--surface);border:1px solid var(--border);
  border-radius:10px;overflow:hidden;margin-bottom:1.5rem;
}
.detail-row{
  display:grid;grid-template-columns:170px 1fr;
  border-bottom:1px solid var(--border);font-size:0.87rem;
}
.detail-row:last-child{border-bottom:none;}
.detail-label{
  padding:0.7rem 1rem;color:var(--muted);font-weight:700;
  font-size:0.72rem;text-transform:uppercase;letter-spacing:0.06em;
  background:var(--surface2);border-right:1px solid var(--border);
  display:flex;align-items:flex-start;padding-top:0.78rem;
}
.detail-value{padding:0.7rem 1.1rem;line-height:1.6;color:var(--text);}

.section-head{
  font-size:0.74rem;font-weight:700;text-transform:uppercase;
  letter-spacing:0.1em;color:var(--accent);
  margin:1.6rem 0 0.75rem;display:flex;align-items:center;gap:0.5rem;
}
.section-head::after{content:'';flex:1;height:1px;background:var(--border);}

.key-points{list-style:none;display:flex;flex-direction:column;gap:0.5rem;margin-bottom:0.5rem;}
.key-points li{
  display:flex;align-items:flex-start;gap:0.7rem;
  font-size:0.9rem;line-height:1.6;color:var(--text);
  background:var(--surface);border:1px solid var(--border);
  border-radius:8px;padding:0.6rem 0.9rem;
}
.key-points li::before{
  content:'→';color:var(--accent);flex-shrink:0;margin-top:0.05rem;font-weight:700;
}

.notes-block{
  background:#fffbe8;border-left:3px solid var(--accent2);
  border-radius:0 8px 8px 0;padding:1rem 1.2rem;
  font-size:0.9rem;line-height:1.75;color:var(--text-soft);
  margin-bottom:1.5rem;
}

/* prev | counter | next — the counter stays centred whatever the names' length */
.rxn-nav{
  display:grid;grid-template-columns:minmax(0,1fr) auto minmax(0,1fr);align-items:center;gap:1rem;
  margin-top:2.5rem;padding-top:1.5rem;
  border-top:1px solid var(--border);
}
.rxn-nav-count{font-size:0.76rem;color:var(--muted);white-space:nowrap;font-variant-numeric:tabular-nums;}
.nav-btn{
  background:var(--surface);border:1px solid var(--border);
  color:var(--text-soft);padding:0.55rem 0.95rem;border-radius:8px;
  font-size:0.84rem;cursor:pointer;transition:all 0.15s;
  display:flex;align-items:center;gap:0.65rem;
  font-family:inherit;min-width:0;max-width:100%;text-align:left;justify-self:start;
}
.nav-btn.next{text-align:right;justify-self:end;justify-content:flex-end;}
.nav-btn:hover:not(:disabled){border-color:var(--accent);color:var(--accent);background:var(--accent-soft);}
/* No neighbour: keep the slot so the other button stays on its side. */
.nav-btn:disabled{visibility:hidden;}
.nav-arrow{flex-shrink:0;font-size:1rem;line-height:1;}
.nav-btn-text{display:flex;flex-direction:column;gap:0.1rem;min-width:0;}
.nav-btn.next .nav-btn-text{align-items:flex-end;}
.nav-btn-kicker{font-size:0.66rem;font-weight:700;text-transform:uppercase;letter-spacing:0.08em;color:var(--muted2);}
.nav-btn-label{font-size:0.82rem;color:var(--text-soft);max-width:100%;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.nav-btn:hover:not(:disabled) .nav-btn-label{color:inherit;}

.overlay{display:none;position:fixed;inset:0;background:rgba(60,55,40,0.35);z-index:25;}
.overlay.open{display:block;}

/* ════════════════════════════════════════════════════════════════════
   TABLET + PHONE (≤ 1023px) — the sidebar becomes a drawer, so the
   reading column gets the full width
   ════════════════════════════════════════════════════════════════════ */
@media(max-width:1023px){
  :root{--draw-scale:1.3;}
  /* Above the overlay: the ✕ and the search stay usable while the drawer is open. */
  header{position:relative;z-index:40;}
  .hamburger{display:flex;}
  /* the hamburger takes their room in the header row; the search keeps its width */
  .brand-sub,.count-badge{display:none;}
  .sidebar{position:fixed;left:0;top:var(--header-h);bottom:0;z-index:30;
    width:min(320px,86vw);transform:translateX(-100%);visibility:hidden;
    transition:transform 0.22s ease-out,visibility 0s linear 0.22s;
    box-shadow:0 10px 30px rgba(60,55,40,0.18);will-change:transform;}
  .sidebar.open{transform:translateX(0);visibility:visible;transition:transform 0.22s ease-out;}
  .overlay{top:var(--header-h);}
}

/* ════════════════════════════════════════════════════════════════════
   PHONE (≤ 760px)
   ════════════════════════════════════════════════════════════════════ */
@media(max-width:760px){
  :root{--header-h:100px;--draw-scale:1.15;}

  /* Two-row header: brand + actions on row 1, search full-width on row 2 */
  header{flex-wrap:wrap;row-gap:0.45rem;column-gap:0.6rem;padding:0.5rem 0.85rem;height:auto;min-height:56px;
    padding-top:max(0.5rem, env(safe-area-inset-top));align-items:center;}
  .brand{gap:0.5rem;min-width:0;}
  .brand-name{font-size:0.95rem;}
  .brand-sub{display:none;}
  .search-wrap{flex-basis:100%;order:10;max-width:none;}
  /* 16 px — anything smaller makes iOS zoom the page when the field is focused */
  #search{padding:0.5rem 0.8rem 0.5rem 2.1rem;font-size:16px;border-radius:9px;}
  .header-right{gap:0.4rem;}
  .count-badge{display:none;}
  /* On mobile, keep only the primary Quiz CTA visible — muted nav links
     (Export / Admin) are desktop-only features and would force a 3rd
     header row. They remain reachable via direct URL. */
  .nav-link.muted{display:none;}
  .nav-link{font-size:0.8rem;padding:0 0.8rem;min-height:40px;
    display:inline-flex;align-items:center;}

  /* Welcome: compact hero, categories two to a row */
  .welcome{padding:1.5rem 1rem 2rem;justify-content:flex-start;}
  .welcome-logo{width:60px;height:60px;margin-bottom:0.9rem;}
  .welcome h1{font-size:1.4rem;}
  .welcome p{font-size:0.88rem;line-height:1.65;max-width:100%;margin-bottom:1.4rem;}
  .cat-grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:0.55rem;}
  .cat-card{padding:0.8rem 0.85rem;}
  .cat-card-icon{min-width:2.3rem;height:2.3rem;font-size:0.86rem;margin-bottom:0.55rem;}

  /* Reaction page */
  .rxn-page{padding:1rem 1rem 2.5rem;}
  /* the title right below already names the reaction */
  .rxn-breadcrumb .sep,.rxn-breadcrumb .crumb-current{display:none;}
  .rxn-title{font-size:1.25rem;line-height:1.25;}
  .rxn-drawing{padding:1rem 0.75rem;min-height:96px;border-radius:10px;}
  /* Label above value: the uppercase labels do not fit a side column */
  .detail-row{grid-template-columns:1fr;font-size:0.86rem;}
  .detail-label{border-right:none;border-bottom:1px solid var(--border);padding:0.45rem 0.9rem;}
  .detail-value{padding:0.6rem 0.9rem 0.7rem;}
  .key-points li{font-size:0.86rem;padding:0.55rem 0.8rem;}

  /* Bottom nav (prev/next reaction): counter on top, two equal buttons */
  .rxn-nav{grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:0.5rem;margin-top:1.75rem;padding-top:1rem;}
  .rxn-nav-count{order:-1;grid-column:1 / -1;text-align:center;}
  .nav-btn,.nav-btn.next{justify-self:stretch;padding:0.6rem 0.75rem;}
  .nav-btn-label{white-space:normal;display:-webkit-box;-webkit-box-orient:vertical;
    -webkit-line-clamp:2;line-height:1.3;}
}

/* Tiny phones (≤ 380px) */
@media(max-width:380px){
  .nav-link{padding:0 0.65rem;font-size:0.76rem;}
  .brand-name{font-size:0.88rem;}
  .brand-logo{width:26px;height:26px;}
  .welcome h1{font-size:1.28rem;}
  .cat-grid{gap:0.45rem;}
  .cat-card{padding:0.7rem 0.75rem;}
}

/* Touch screens: finger-sized targets (≥ 40 px) */
@media (pointer:coarse){
  .diff-pill{min-height:40px;padding:0;display:flex;align-items:center;justify-content:center;}
  .cat-header{padding-top:0.8rem;padding-bottom:0.8rem;}
  .rxn-link{padding-top:0.7rem;padding-bottom:0.7rem;}
  /* larger hit area, same layout */
  .brand-home,.rxn-breadcrumb .cat-name{padding:0.6rem 0;margin:-0.6rem 0;}
}
</style>
</head>
<body>

<header>
  <button class="hamburger" id="hamburger" onclick="toggleSidebar()" aria-label="Menü öffnen" aria-controls="sidebar" aria-expanded="false">☰</button>
  <a href="./index.html" class="brand brand-home" title="Startseite — Reaktionen">
    <div class="brand-logo">
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="14 52 174 187">
        <path fill="#ff0000" d="M 153.27953,54.242684 141.3862,76.472852 73.360897,76.250643 39.904024,139.16308 16.228467,139.27419 v 13.11599 l 23.452832,0.22273 34.124015,62.80081 68.025306,0.11111 11.33781,21.56406 10.67067,-6.55826 -11.67113,-22.11958 33.79071,-62.80082 -34.12402,-62.801331 12.11554,-21.897371 z m -12.0804,35.318258 30.29893,56.472008 -30.37747,56.07874 -60.322938,0.1571 -30.220377,-56.35367 30.220377,-56.27563 z m 13.04727,56.216728 -22.51801,41.95092 3.81166,2.31872 22.518,-41.87289 c 0,0 2.9e-4,-0.0192 -3.81165,-2.39675 z"/>
      </svg>
    </div>
    <span class="brand-name">OC Reaktionen</span>
    <span class="brand-sub">ÖChO</span>
  </a>
  <div class="search-wrap">
    <span class="search-icon">⌕</span>
    <input id="search" type="text" placeholder="Reaktionen suchen…" oninput="globalSearch(this.value)" autocomplete="off">
  </div>
  <div class="header-right">
    <span class="count-badge" id="count-badge">— Reaktionen</span>
    <a href="./quiz.html" class="nav-link" title="Quiz / Aufgaben">Quiz ↗</a>
    <a href="./export.html" class="nav-link muted" title="Exportieren (PDF/Druck)">Export</a>
    <a href="./admin.html" class="nav-link muted" title="Adminbereich">Admin</a>
  </div>
</header>

<div class="overlay" id="overlay" onclick="toggleSidebar()"></div>

<div class="layout">
  <nav class="sidebar" id="sidebar">
    <div class="sidebar-top">
      <div class="sidebar-label">Schwierigkeit</div>
      <div class="diff-filter" id="diff-filter">
        <div class="diff-pill diff-A active" data-diff="A" onclick="toggleDiff('A')" title="Einsteiger/innen" role="button" tabindex="0" aria-pressed="true">A</div>
        <div class="diff-pill diff-B active" data-diff="B" onclick="toggleDiff('B')" title="LW / JÖChO" role="button" tabindex="0" aria-pressed="true">B</div>
        <div class="diff-pill diff-C active" data-diff="C" onclick="toggleDiff('C')" title="BW" role="button" tabindex="0" aria-pressed="true">C</div>
        <div class="diff-pill diff-D active" data-diff="D" onclick="toggleDiff('D')" title="Spezial" role="button" tabindex="0" aria-pressed="true">D</div>
      </div>
      <div class="sidebar-label" style="margin-top:0.85rem">Kategorien</div>
    </div>
    <div id="cat-list"></div>
    <a class="sidebar-foot" href="./lizenzen.html">Lizenzen und Hinweise</a>
  </nav>

  <main class="main" id="main">
  </main>
</div>

<script>
let reactions = [];
let activeId  = null;

/* Escaped text with LaTeX-lite sub/superscripts (S_N2, C_12H_22O_11, Fe^3+). */
const ct = s => ChemText.html(s == null ? '' : s);
let diffFilter = new Set(['A','B','C','D']);  // visible difficulties; empty difficulty always shown

/* Mark on each category card: the usual shorthand for the reaction type
   (LaTeX-lite, see chem-text.js). Unknown categories show their initials. */
const CAT_ICONS = {
  'Nucleophile Substitution': 'S_N',
  'Eliminierung':             'E',
  'Addition an C=C / C≡C':    'A_E',
  'Aromatische Substitution': 'S_{E}Ar',
  'Carbonyl — Additionen':    'C=O',
  'Enolate & C–C-Knüpfung':   'C–C',
  'Carbonsäuren & Derivate':  'COOH',
  'Oxidation & Reduktion':    'Redox',
  'Pericyclische Reaktionen': '[4+2]',
  'Umlagerungen':             '[1,2]',
  'Heterocyclen & Biochemie': 'Het',
};
const catIcon = cat => CAT_ICONS[cat] ||
  cat.split(/[\s&—–\/-]+/).filter(Boolean).slice(0, 2).map(w => w[0]).join('');

const LOGO_SVG = `<svg xmlns="http://www.w3.org/2000/svg" viewBox="14 52 174 187"><path fill="#ff0000" d="M 153.27953,54.242684 141.3862,76.472852 73.360897,76.250643 39.904024,139.16308 16.228467,139.27419 v 13.11599 l 23.452832,0.22273 34.124015,62.80081 68.025306,0.11111 11.33781,21.56406 10.67067,-6.55826 -11.67113,-22.11958 33.79071,-62.80082 -34.12402,-62.801331 12.11554,-21.897371 z m -12.0804,35.318258 30.29893,56.472008 -30.37747,56.07874 -60.322938,0.1571 -30.220377,-56.35367 30.220377,-56.27563 z m 13.04727,56.216728 -22.51801,41.95092 3.81166,2.31872 22.518,-41.87289 c 0,0 2.9e-4,-0.0192 -3.81165,-2.39675 z"/></svg>`;

async function init() {
  try {
    reactions = await fetch('./data/reactions.json').then(r => r.json());
  } catch(e) {
    showError('Reaktionen konnten nicht geladen werden. Bei lokaler Nutzung Server starten: <code>node server.js</code>');
    return;
  }
  document.getElementById('count-badge').textContent = reactions.length + ' Reaktionen';
  buildSidebar();
  showWelcome();
  const hash = location.hash.slice(1);
  if (hash) { const r = reactions.find(x => x.id === hash); if (r) showReaction(hash); }
}

function categories() { return [...new Set(reactions.map(r => r.category))]; }

function rxnVisible(r) {
  return !r.difficulty || diffFilter.has(r.difficulty);
}

function buildSidebar() {
  const cats = categories();
  document.getElementById('cat-list').innerHTML = cats.map(cat => {
    const items = reactions.filter(r => r.category === cat);
    const visibleN = items.filter(rxnVisible).length;
    return `<div class="cat-group" data-cat="${cat}"${visibleN===0?' style="display:none"':''}>
      <div class="cat-header" onclick="toggleCat(this)" role="button" tabindex="0" aria-expanded="false">
        <span class="cat-arrow">▶</span>
        <span>${cat}</span>
        <span class="cat-count">${visibleN}</span>
      </div>
      <div class="cat-items">
        ${items.map(r => {
          const d = r.difficulty || '';
          const badge = d ? `<span class="diff-badge diff-${d}" title="${diffLabel(d)}">${d}</span>` : '';
          const hidden = !rxnVisible(r) ? ' hidden' : '';
          const diffCls = d ? ' diff-'+d : '';
          return `<div class="rxn-link${diffCls}${hidden}" id="link-${r.id}" onclick="showReaction('${r.id}')" role="button" tabindex="0" title="${ChemText.esc(ChemText.plain(r.name))}">${badge}<span class="rxn-name">${ct(r.name)}</span></div>`;
        }).join('')}
      </div>
    </div>`;
  }).join('');
  const act = activeId && document.getElementById('link-'+activeId);
  if (act) {
    act.classList.add('active');
    act.closest('.cat-group')?.querySelector('.cat-header')?.classList.add('open');
  }
  syncCatHeaders();
}

/* aria-expanded mirrors the .open class that shows a category's items. */
function syncCatHeaders() {
  document.querySelectorAll('.cat-header').forEach(h =>
    h.setAttribute('aria-expanded', h.classList.contains('open') ? 'true' : 'false'));
}

function diffLabel(d) {
  return ({A:'Einsteiger/innen', B:'LW / JÖChO', C:'BW', D:'Spezial'})[d] || '';
}

function toggleDiff(d) {
  const pill = document.querySelector(`.diff-pill[data-diff="${d}"]`);
  if (diffFilter.has(d)) { diffFilter.delete(d); pill.classList.remove('active'); }
  else                   { diffFilter.add(d);    pill.classList.add('active');    }
  pill.setAttribute('aria-pressed', diffFilter.has(d) ? 'true' : 'false');
  buildSidebar();
  const q = document.getElementById('search').value;
  if (q.trim()) globalSearch(q);
  // keep current detail page open even if its row gets hidden — the
  // header navigation still works, and re-enabling the filter restores it.
}
window.toggleDiff = toggleDiff;

function toggleCat(header) { header.classList.toggle('open'); syncCatHeaders(); }

function openSidebarFor(id) {
  const link = document.getElementById('link-'+id);
  if (!link) return;
  const header = link.closest('.cat-group')?.querySelector('.cat-header');
  if (header) header.classList.add('open');
  syncCatHeaders();
  // In drawer mode the list is out of sight; it is scrolled when the drawer opens.
  if (!isDrawerMode()) setTimeout(() => link.scrollIntoView({block:'nearest',behavior:'smooth'}), 50);
}

function showWelcome() {
  const cats = categories();
  document.getElementById('main').innerHTML = `
    <div class="welcome">
      <div class="welcome-logo">${LOGO_SVG}</div>
      <h1>Organische Chemie <span class="red">Reaktionen</span></h1>
      <p>Ein kompaktes Nachschlagewerk — Mechanismen, Bedingungen, Substratumfang und zentrale Erkenntnisse zu den wichtigsten organischen Transformationen. Reaktion aus der Seitenleiste wählen oder Kategorie erkunden.</p>
      <div class="cat-grid">
        ${cats.map(cat => {
          const n = reactions.filter(r => r.category === cat).length;
          return `<div class="cat-card" onclick="openCategory('${cat}')" role="button" tabindex="0">
            <div class="cat-card-icon" aria-hidden="true"><span>${ct(catIcon(cat))}</span></div>
            <div class="cat-card-name">${cat}</div>
            <div class="cat-card-count">${n} Reaktion${n!==1?'en':''}</div>
          </div>`;
        }).join('')}
      </div>
    </div>`;
}

function openCategory(cat) {
  const first = reactions.find(r => r.category === cat);
  if (first) showReaction(first.id);
  document.querySelectorAll('.cat-header').forEach(h => {
    if (h.querySelector('span:nth-child(2)')?.textContent === cat) h.classList.add('open');
  });
  syncCatHeaders();
}

const DETAIL_FIELDS = [
  {key:'substituents',    label:'Substituenten'},
  {key:'conditions',      label:'Bedingungen'},
  {key:'substrate_scope', label:'Substratumfang'},
  {key:'nucleophile',     label:'Nukleophil'},
  {key:'leaving_group',   label:'Abgangsgruppe'},
  {key:'reagents',        label:'Reagenzien'},
  {key:'mechanism',       label:'Mechanismus'},
  {key:'stereochemistry', label:'Stereochemie'},
  {key:'kinetics',        label:'Kinetik'},
];

function showReaction(id) {
  const r = reactions.find(x => x.id === id);
  if (!r) return;
  activeId = id;

  document.querySelectorAll('.rxn-link').forEach(el => el.classList.remove('active'));
  const lnk = document.getElementById('link-'+id);
  if (lnk) lnk.classList.add('active');
  openSidebarFor(id);
  history.replaceState(null,'','#'+id);

  const catItems = reactions.filter(x => x.category === r.category);
  const idx = catItems.findIndex(x => x.id === id);
  const prev = catItems[idx-1] || null;
  const next = catItems[idx+1] || null;

  const svgId = 'rxn-svg-'+id;
  const drawing = MolRenderer.rxnSource(r);
  const drawingHtml = drawing
    ? `<div id="${svgId}" class="struct-slot"></div>`
    : `<div class="scheme-text" style="color:var(--muted)">Keine Struktur verfügbar</div>`;

  const detailsHtml = DETAIL_FIELDS.filter(f => r[f.key]).map(f => `
    <div class="detail-row">
      <div class="detail-label">${f.label}</div>
      <div class="detail-value">${ct(r[f.key])}</div>
    </div>`).join('');

  const keyPointsHtml = (r.key_points||[]).length ? `
    <div class="section-head">Schlüsselpunkte</div>
    <ul class="key-points">${(r.key_points).map(p=>`<li>${ct(p)}</li>`).join('')}</ul>` : '';

  document.getElementById('main').innerHTML = `
    <div class="rxn-page">
      <div class="rxn-breadcrumb">
        <span class="cat-name" onclick="openCategory('${r.category}')" role="button" tabindex="0">${r.category}</span>
        <span class="sep">›</span>
        <span class="crumb-current">${ct(r.name)}</span>
      </div>

      <h1 class="rxn-title">${ct(r.name)}</h1>
      ${r.subtitle ? `<div class="rxn-subtitle">${ct(r.subtitle)}</div>` : ''}
      <div class="rxn-drawing">${drawingHtml}</div>

      ${detailsHtml ? `<div class="rxn-details">${detailsHtml}</div>` : ''}

      ${keyPointsHtml}

      <nav class="rxn-nav" aria-label="Weitere Reaktionen dieser Kategorie">
        <button class="nav-btn prev" onclick="${prev?`showReaction('${prev.id}')`:'void 0'}" ${prev?'':'disabled'}>
          <span class="nav-arrow" aria-hidden="true">←</span>
          <span class="nav-btn-text"><span class="nav-btn-kicker">Vorherige</span><span class="nav-btn-label">${ct(prev?.name)}</span></span>
        </button>
        <span class="rxn-nav-count">${idx+1} / ${catItems.length}</span>
        <button class="nav-btn next" onclick="${next?`showReaction('${next.id}')`:'void 0'}" ${next?'':'disabled'}>
          <span class="nav-btn-text"><span class="nav-btn-kicker">Nächste</span><span class="nav-btn-label">${ct(next?.name)}</span></span>
          <span class="nav-arrow" aria-hidden="true">→</span>
        </button>
      </nav>
    </div>`;

  document.getElementById('main').scrollTop = 0;
  setSidebar(false);

  if (drawing) {
    MolRenderer.ready().then(() => {
      const host = document.getElementById(svgId);
      if (!host) return;
      const svg = MolRenderer.drawReaction(drawing, host, {
        above: r.reagent_label || '',
        below: r.reagent_label_below || '',
        aboveMols: r.reagent_mols || []
      });
      // Natural width → CSS scales it by --draw-scale, capped at the box width.
      const w = svg && parseFloat(svg.getAttribute('width'));
      if (w) { svg.style.setProperty('--nat-w', w + 'px'); svg.classList.add('scaled'); }
    }).catch(err => console.error('MolRenderer:', err));
  }
}

function globalSearch(q) {
  const s = q.toLowerCase().trim();
  document.querySelectorAll('.cat-group').forEach(group => {
    const links = group.querySelectorAll('.rxn-link');
    let any = false;
    links.forEach(link => {
      const id  = link.id.replace('link-','');
      const r   = reactions.find(x => x.id === id);
      const hit = rxnVisible(r) && (!s
        || r.name.toLowerCase().includes(s)
        || r.category.toLowerCase().includes(s)
        || (r.subtitle||'').toLowerCase().includes(s)
        || (r.transformation||'').toLowerCase().includes(s)
        || (r.key_points||[]).join(' ').toLowerCase().includes(s));
      link.classList.toggle('hidden', !hit);
      if (hit) any = true;
    });
    group.style.display = any ? '' : 'none';
    const header = group.querySelector('.cat-header');
    if (s && any) header.classList.add('open');
  });
  syncCatHeaders();
  // The results are the sidebar list — on a phone or tablet, show it.
  if (s) { setSidebar(true); document.getElementById('sidebar').scrollTop = 0; }
}

/* ≤ 1023 px the sidebar is a drawer over the page (see the CSS). */
const drawerQuery = window.matchMedia('(max-width: 1023px)');
function isDrawerMode() { return drawerQuery.matches; }

function setSidebar(open) {
  const sb = document.getElementById('sidebar');
  if (open && !isDrawerMode()) return;
  if (open === sb.classList.contains('open')) return;
  sb.classList.toggle('open', open);
  document.getElementById('overlay').classList.toggle('open', open);
  const btn = document.getElementById('hamburger');
  btn.textContent = open ? '✕' : '☰';
  btn.setAttribute('aria-expanded', open ? 'true' : 'false');
  btn.setAttribute('aria-label', open ? 'Menü schließen' : 'Menü öffnen');
  const act = open && activeId && document.getElementById('link-'+activeId);
  if (act && !act.classList.contains('hidden')) {   // centre the current reaction in the list
    const r = act.getBoundingClientRect(), top = sb.getBoundingClientRect().top;
    sb.scrollTop += (r.top - top) - (sb.clientHeight - r.height) / 2;
  }
}
function toggleSidebar() {
  setSidebar(!document.getElementById('sidebar').classList.contains('open'));
}
// Back on a wide screen the sidebar is part of the page again.
drawerQuery.addEventListener('change', e => { if (!e.matches) setSidebar(false); });

document.addEventListener('keydown', e => {
  if (e.key === 'Escape') { setSidebar(false); return; }
  // Keyboard access for the clickable rows, cards and pills (role="button").
  if ((e.key === 'Enter' || e.key === ' ') && e.target.matches?.('[role="button"]')) {
    e.preventDefault();
    e.target.click();
  }
});

// Keep --header-h CSS var in sync with the actual rendered header height
// so the sidebar drawer and layout calc stay aligned across screen sizes / rotation.
function syncHeaderHeight() {
  const h = document.querySelector('header');
  if (!h) return;
  document.documentElement.style.setProperty('--header-h', h.offsetHeight + 'px');
}
window.addEventListener('resize', syncHeaderHeight);
window.addEventListener('orientationchange', syncHeaderHeight);
if (window.ResizeObserver) {
  new ResizeObserver(syncHeaderHeight).observe(document.querySelector('header'));
}
syncHeaderHeight();

function showError(msg) {
  document.getElementById('main').innerHTML = `
    <div style="padding:3rem;text-align:center;color:var(--red)">
      <div style="font-size:2rem;margin-bottom:1rem">⚠</div>
      <div>${msg}</div>
    </div>`;
}

init();
</script>
</body>
</html>
